# Keep the pinned GitHub Actions versions current.
# Rust crates.io dependencies are deliberately absent: this project has none,
# and the CI job "Zero dependency policy" fails the build if that ever changes.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
