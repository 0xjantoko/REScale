# Jaga versi GitHub Actions yang di-pin tetap mutakhir.
# Dependensi crate crates.io sengaja tidak ada: proyek ini tidak memakainya,
# dan job CI "Zero dependency policy" akan menggagalkan build bila itu berubah.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
